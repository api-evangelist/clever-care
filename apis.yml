aid: clever-care
name: Clever Care
description: 'Clever Care Health Plan is a California Medicare Advantage (HMO and HMO C-SNP) plan headquartered
  in Huntington Beach, CA, that blends the healing therapies of Eastern medicine with the innovative practices
  of Western medicine to serve Los Angeles, Orange, San Diego, Riverside, and San Bernardino counties.
  In compliance with the CMS Interoperability and Patient Access rule (CMS-9115-F), Clever Care operates
  a secure, standards-based HL7 FHIR R4 API surface (WSO2 gateway) spanning 13 published resource APIs
  across three domains: Patient Access (CARIN Blue Button), Provider Directory (Da Vinci PDex Plan-Net),
  and Drug Formulary (Da Vinci US Drug Formulary). Patient Access resources are secured with SMART on
  FHIR OAuth 2.0 / OpenID Connect; directory and formulary resources are public and rate-limited. Provider
  Access, Payer-to-Payer, and Prior Authorization APIs are planned for January 1, 2027.'
